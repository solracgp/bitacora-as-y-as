<script>
  // Función para obtener/mostrar el correlativo estimado en el Paso 3 (Resumen)
  function generarVistaPreviaCorrelativo() {
    const tecnicoSelect = document.getElementById("selectTecnico") ? document.getElementById("selectTecnico").value : "";
    let prefijo = "REG";
    const tecLower = tecnicoSelect.toLowerCase();

    if (tecLower.includes("carlos gonzalez") || tecLower.includes("carlos gonzález")) {
      prefijo = "CG";
    } else if (tecLower.includes("carlos prueba")) {
      prefijo = "CP";
    } else if (tecLower.includes("benjamin") || tecLower.includes("benjamín")) {
      prefijo = "BA";
    }

    // Muestra en la interfaz un correlativo temporal o proyectado
    const elementoCorrelativo = document.getElementById("lblCorrelativo");
    if (elementoCorrelativo) {
      elementoCorrelativo.innerText = prefijo + "-REGISTRANDO...";
    }
  }

  // Ejecutar al enviar el formulario
  function alEnviarFormulario() {
    generarVistaPreviaCorrelativo();
    document.getElementById("btnEnviar").disabled = true;
    document.getElementById("btnEnviar").innerText = "Guardando en Planilla...";
  }
</script>
